[project]
name = "stock-screener"
version = "0.1.0"
description = "Stock screener personal impulsado por ML: pocas oportunidades de alta calidad"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "yfinance>=0.2.50",
    "fredapi>=0.5.2",
    "requests>=2.32",
    "lxml>=5.2",
    "shap>=0.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "joblib>=1.4",
]

[project.optional-dependencies]
sentiment = [
    "transformers>=4.44",
    "torch>=2.7",
]
drift = [
    "evidently>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.14",
]

# La RTX 5070 (Blackwell, sm_120) requiere builds de torch con CUDA 12.8+
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:yfinance",
    # starlette.testclient avisa de httpx2 en cada import; ruido en cada run
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "RUF",  # reglas propias de ruff
]
ignore = [
    "E501",    # el formateo de líneas largas lo decide `ruff format`
    "B008",    # Depends()/Query() en firmas: patrón normal en FastAPI
    "RUF001",  # las cadenas en español usan tildes y comillas tipográficas
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]  # desempaquetados parciales en asserts
